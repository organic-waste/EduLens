<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduLens AI</title>
  </head>
  <body>
    <section id="auth-screen" class="auth-screen" hidden>
      <div class="auth-card">
        <div class="auth-animation-elements" aria-hidden="true">
          <span class="auth-anim-element auth-anim-circle"></span>
          <span class="auth-anim-element auth-anim-square"></span>
        </div>
        <p class="eyebrow">EDULENS</p>
        <h1 id="auth-title">登录学习助手</h1>
        <p id="auth-description" class="auth-description">登录后即可使用 AI 对话、摘要库和个性化学习记忆。</p>
        <form id="auth-form" class="auth-form" novalidate>
          <label id="auth-username-field" hidden>用户名<input id="auth-username" autocomplete="username" minlength="3" placeholder="至少 3 个字符" /></label>
          <label id="auth-account-field">用户名或邮箱<input id="auth-account" autocomplete="username" placeholder="输入用户名或邮箱" required /></label>
          <label id="auth-email-field" hidden>邮箱<input id="auth-email" type="email" autocomplete="email" placeholder="name@example.com" /></label>
          <label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 个字符" required /></label>
          <label id="auth-confirm-field" hidden>确认密码<input id="auth-confirm-password" type="password" autocomplete="new-password" minlength="6" placeholder="再次输入密码" /></label>
          <p id="auth-error" class="auth-error" role="alert"></p>
          <button id="auth-submit" class="auth-submit" type="submit">登录</button>
        </form>
        <button id="auth-toggle" class="text-button" type="button">还没有账号？去注册</button>
      </div>
    </section>

    <main id="ai-shell" class="ai-shell" hidden>
      <header class="ai-header">
        <div>
          <p class="eyebrow">EDULENS</p>
          <h1>AI 学习助手</h1>
        </div>
        <div class="header-actions">
        <button
          id="profile-button"
          class="icon-button"
          type="button"
          title="个人主页"
          aria-label="个人主页"
        >
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5Z" /></svg>
        </button>
        <button
          id="settings-toggle"
          class="icon-button"
          type="button"
          title="摘要库"
          aria-label="摘要库"
        >
          <svg class="action-icon library-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M411.733333 885.333333H192c-6.4 0-10.666667-4.266667-10.666667-10.666666V149.333333c0-6.4 4.266667-10.666667 10.666667-10.666666h576c6.4 0 10.666667 4.266667 10.666667 10.666666v219.733334c0 17.066667 14.933333 32 32 32s32-14.933333 32-32V149.333333c0-40.533333-34.133333-74.666667-74.666667-74.666666H192C151.466667 74.666667 117.333333 108.8 117.333333 149.333333v725.333334c0 40.533333 34.133333 74.666667 74.666667 74.666666h219.733333c17.066667 0 32-14.933333 32-32s-14.933333-32-32-32z" />
            <path d="M704 458.666667c-134.4 0-245.333333 110.933333-245.333333 245.333333S569.6 949.333333 704 949.333333 949.333333 838.4 949.333333 704 838.4 458.666667 704 458.666667z m0 426.666666c-100.266667 0-181.333333-81.066667-181.333333-181.333333s81.066667-181.333333 181.333333-181.333333 181.333333 81.066667 181.333333 181.333333-81.066667 181.333333-181.333333 181.333333z" />
            <path d="M802.133333 716.8l-66.133333-29.866667V597.333333c0-17.066667-14.933333-32-32-32s-32 14.933333-32 32v110.933334c0 12.8 8.533333 23.466667 19.2 29.866666l85.333333 38.4c4.266667 2.133333 8.533333 2.133333 12.8 2.133334 12.8 0 23.466667-6.4 29.866667-19.2 6.4-17.066667 0-34.133333-17.066667-42.666667zM693.333333 298.666667c0-17.066667-14.933333-32-32-32H298.666667c-17.066667 0-32 14.933333-32 32s14.933333 32 32 32h362.666666c17.066667 0 32-14.933333 32-32zM298.666667 437.333333c-17.066667 0-32 14.933333-32 32s14.933333 32 32 32h106.666666c17.066667 0 32-14.933333 32-32s-14.933333-32-32-32h-106.666666z" />
          </svg>
          <svg class="action-icon return-icon" viewBox="0 0 1024 1024" aria-hidden="true" hidden>
            <path d="M384 512L731.733333 202.666667c17.066667-14.933333 19.2-42.666667 4.266667-59.733334-14.933333-17.066667-42.666667-19.2-59.733333-4.266666l-384 341.333333c-10.666667 8.533333-14.933333 19.2-14.933334 32s4.266667 23.466667 14.933334 32l384 341.333333c8.533333 6.4 19.2 10.666667 27.733333 10.666667 12.8 0 23.466667-4.266667 32-14.933333 14.933333-17.066667 14.933333-44.8-4.266667-59.733334L384 512z" />
          </svg>
        </button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="empty-state">
          <strong>从一个问题开始</strong>
          <span>让 AI 帮你理解当前学习内容。</span>
        </div>
      </section>

      <section id="history" class="history" hidden>
        <div class="history-heading">
          <h2>摘要库</h2>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <form id="composer" class="composer">
        <div id="summary-context" class="summary-context" hidden>
          <span class="summary-context-label">关联摘要：</span>
          <strong id="summary-context-title"></strong>
          <button id="clear-summary-context" class="summary-context-close" type="button" title="移除摘要上下文" aria-label="移除摘要上下文">×</button>
        </div>
        <textarea
          id="prompt"
          rows="3"
          placeholder="输入你的问题..."
          required
        ></textarea>
        <div class="composer-footer">
          <span id="status" class="status">就绪</span>
          <div class="composer-actions">
            <button id="select-page" class="tool-button" type="button" title="引用当前网页中的文字">引用网页选区</button>
            <button id="summarize" class="tool-button" type="button" disabled>生成摘要</button>
            <button id="send" class="send-button" type="submit" title="发送" aria-label="发送">
              <svg class="action-icon" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M896 467.2l-362.666667-341.333333c-2.133333-2.133333-6.4-4.266667-8.533333-6.4-4.266667-2.133333-6.4-2.133333-10.666667-2.133334s-8.533333 0-10.666666 2.133334c-4.266667 2.133333-6.4 4.266667-8.533334 6.4l-362.666666 341.333333c-12.8 12.8-12.8 32-2.133334 44.8 12.8 12.8 32 12.8 44.8 2.133333l309.333334-290.133333V874.666667c0 17.066667 14.933333 32 32 32s32-14.933333 32-32V224L853.333333 514.133333c6.4 6.4 14.933333 8.533333 21.333334 8.533334 8.533333 0 17.066667-4.266667 23.466666-10.666667 12.8-12.8 10.666667-32-2.133333-44.8z" /></svg>
            </button>
          </div>
        </div>
      </form>

      <section id="summary" class="summary" hidden>
        <div class="summary-heading"><h2 id="summary-title">网页摘要</h2><button id="close-summary" class="return-button" type="button" title="围绕摘要提问" aria-label="围绕摘要提问"><svg class="action-icon" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M853.333333 138.666667H170.666667c-40.533333 0-74.666667 34.133333-74.666667 74.666666v512c0 40.533333 34.133333 74.666667 74.666667 74.666667h151.466666V917.333333c0 12.8 8.533333 25.6 19.2 29.866667 4.266667 2.133333 8.533333 2.133333 12.8 2.133333 8.533333 0 17.066667-4.266667 23.466667-10.666666l136.533333-138.666667H853.333333c40.533333 0 74.666667-34.133333 74.666667-74.666667V213.333333c0-40.533333-34.133333-74.666666-74.666667-74.666666z m10.666667 586.666666c0 6.4-4.266667 10.666667-10.666667 10.666667H501.333333c-8.533333 0-17.066667 4.266667-23.466666 10.666667l-89.6 93.866666V768c0-17.066667-14.933333-32-32-32H170.666667c-6.4 0-10.666667-4.266667-10.666667-10.666667V213.333333c0-6.4 4.266667-10.666667 10.666667-10.666666h682.666666c6.4 0 10.666667 4.266666 10.666667 10.666666v512z" /><path d="M512 490.666667H298.666667c-17.066667 0-32 14.933333-32 32S281.6 554.666667 298.666667 554.666667h213.333333c17.066667 0 32-14.933333 32-32S529.066667 490.666667 512 490.666667zM672 341.333333H298.666667c-17.066667 0-32 14.933333-32 32S281.6 405.333333 298.666667 405.333333h373.333333c17.066667 0 32 14.933333 32-32s-14.933333-32-32-32z" /></svg></button></div>
        <div id="summary-items" class="summary-items"></div>
      </section>

    </main>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
