<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduLens AI</title>
  </head>
  <body>
    <section id="auth-screen" class="auth-screen" hidden>
      <div class="auth-card">
        <div class="auth-animation-elements" aria-hidden="true">
          <span class="auth-anim-element auth-anim-circle"></span>
          <span class="auth-anim-element auth-anim-square"></span>
        </div>
        <p class="eyebrow">EDULENS</p>
        <h1 id="auth-title">登录学习助手</h1>
        <p id="auth-description" class="auth-description">登录后即可使用 AI 对话、摘要库和个性化学习记忆。</p>
        <form id="auth-form" class="auth-form" novalidate>
          <label id="auth-username-field" hidden>用户名<input id="auth-username" autocomplete="username" minlength="3" placeholder="至少 3 个字符" /></label>
          <label id="auth-account-field">用户名或邮箱<input id="auth-account" autocomplete="username" placeholder="输入用户名或邮箱" required /></label>
          <label id="auth-email-field" hidden>邮箱<input id="auth-email" type="email" autocomplete="email" placeholder="name@example.com" /></label>
          <label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 个字符" required /></label>
          <label id="auth-confirm-field" hidden>确认密码<input id="auth-confirm-password" type="password" autocomplete="new-password" minlength="6" placeholder="再次输入密码" /></label>
          <p id="auth-error" class="auth-error" role="alert"></p>
          <button id="auth-submit" class="auth-submit" type="submit">登录</button>
        </form>
        <button id="auth-toggle" class="text-button" type="button">还没有账号？去注册</button>
      </div>
    </section>

    <main id="ai-shell" class="ai-shell" hidden>
      <header class="ai-header">
        <div>
          <p class="eyebrow">EDULENS</p>
          <h1>AI 学习助手</h1>
        </div>

          class="icon-button"
          type="button"
          title="个人主页"

        </button>

        </button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="empty-state">
          <strong>从一个问题开始</strong>
          <span>让 AI 帮你理解当前学习内容。</span>
        </div>
      </section>

      <section id="history" class="history" hidden>
        <div class="history-heading">
          <h2>摘要库</h2>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <form id="composer" class="composer">
        <div id="summary-context" class="summary-context" hidden>
          <span class="summary-context-label">关联摘要：</span>
          <strong id="summary-context-title"></strong>
          <button id="clear-summary-context" class="summary-context-close" type="button" title="移除摘要上下文" aria-label="移除摘要上下文">×</button>
        </div>
        <textarea
          id="prompt"
          rows="3"
          placeholder="输入你的问题..."
          required
        ></textarea>
        <div class="composer-footer">
          <span id="status" class="status">就绪</span>
          <div class="composer-actions">
            <button id="select-page" class="tool-button" type="button" title="引用当前网页中的文字">引用网页选区</button>
            <button id="summarize" class="tool-button" type="button" disabled>生成摘要</button>
            <button id="send" class="send-button" type="submit" title="发送" aria-label="发送">
              <svg class="action-icon" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M896 467.2l-362.666667-341.333333c-2.133333-2.133333-6.4-4.266667-8.533333-6.4-4.266667-2.133333-6.4-2.133333-10.666667-2.133334s-8.533333 0-10.666666 2.133334c-4.266667 2.133333-6.4 4.266667-8.533334 6.4l-362.666666 341.333333c-12.8 12.8-12.8 32-2.133334 44.8 12.8 12.8 32 12.8 44.8 2.133333l309.333334-290.133333V874.666667c0 17.066667 14.933333 32 32 32s32-14.933333 32-32V224L853.333333 514.133333c6.4 6.4 14.933333 8.533333 21.333334 8.533334 8.533333 0 17.066667-4.266667 23.466666-10.666667 12.8-12.8 10.666667-32-2.133333-44.8z" /></svg>
            </button>
          </div>
        </div>
      </form>

        <div id="summary-items" class="summary-items"></div>
      </section>

    </main>

  </body>
</html>
